<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirLink Drop | Turbo WebRTC P2P</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.22) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.14) 0px, transparent 50%);
      color: #f8fafc;
      padding: 20px 16px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 940px;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }

    /* Top Header */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .brand h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      color: #94a3b8;
      font-size: 0.84rem;
      margin-top: 2px;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copy-pill {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-pill:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: #6366f1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* 2-Column Split Grid */
    .split-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      align-items: stretch;
    }

    @media (max-width: 780px) {
      .split-grid {
        grid-template-columns: 1fr;
      }
      .app-wrapper {
        padding: 20px 16px;
      }
    }

    .left-col {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .box-container {
      background: rgba(11, 15, 25, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 18px;
    }

    .box-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .room-bar, .chat-input-bar {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 11px 14px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    input[type="text"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .connect-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .connect-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .connect-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    }

    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .upload-zone {
      position: relative;
      border: 2px dashed rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 34px 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-zone:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.05);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
      display: block;
    }

    .upload-text {
      font-size: 0.88rem;
      color: #cbd5e1;
      font-weight: 500;
      word-break: break-all;
    }

    .send-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1 0%, #10b981 100%);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.45);
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .progress-bar-container {
      margin-top: 14px;
      display: none;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      transition: width 0.12s ease-out;
    }

    /* Right Column: Full-Height Chat */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 410px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
    }

    .chat-box::-webkit-scrollbar {
      width: 4px;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .msg {
      max-width: 82%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 0.86rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.peer {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.09);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .chat-placeholder {
      color: #475569;
      font-size: 0.82rem;
      text-align: center;
      margin: auto;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="brand">
        <h1>AirLink Drop</h1>
        <p>Direct peer-to-peer file transfer & encrypted chat.</p>
      </div>
      <div class="header-badges">
        <button class="copy-pill" id="copyRoomBtn" title="Copy Room ID">Room ID: <span id="activeRoomLabel"></span> 📋</button>
        <div class="badge">⚡ 4X TURBO WEBRTC</div>
      </div>
    </div>

    <!-- 2-Column Split Grid -->
    <div class="split-grid">
      <!-- Left Column: Connection + File Transfer -->
      <div class="left-col">
        <div class="box-container">
          <span class="box-label">Connection Channel</span>
          <div class="room-bar">
            <input type="text" id="roomInput" placeholder="Enter Room ID (e.g. 500)" autocomplete="off" />
            <button id="connectBtn" class="connect-btn">Join</button>
          </div>
          <div class="status-row">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
          </div>
        </div>

        <div class="box-container" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <span class="box-label">Select File (No Size Limit)</span>
            <div class="upload-zone">
              <input type="file" id="fileInput" />
              <span class="upload-icon">📂</span>
              <span class="upload-text" id="fileLabel">Click or drop file to share</span>
            </div>
          </div>

          <div>
            <button id="sendBtn" class="send-btn" disabled>Send File</button>

            <div class="progress-bar-container" id="progressWrapper">
              <div class="progress-stats">
                <span id="progressStatus">Syncing: 0%</span>
                <span id="speedText">0.0 MB/s</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" id="progressFill"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Live P2P Chat -->
      <div class="box-container chat-panel">
        <span class="box-label">Direct P2P Chat</span>
        <div class="chat-box" id="chatBox">
          <div class="chat-placeholder" id="chatPlaceholder">Connect with a peer to start chatting...</div>
        </div>
        <div class="chat-input-bar">
          <input type="text" id="chatInput" placeholder="Type a message..." disabled />
          <button id="chatSendBtn" class="connect-btn" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
